name: Gate

# Every PR and every push to main gets a fresh GitHub-hosted runner: no
# leftover node_modules, dist, or turbo cache from a prior run unless we put
# it there ourselves below. Freshness by itself does not catch anything here
# — it is where the bug this workflow guards against HIDES: `eslint .`
# without a `**/`-anchored `ignores` entry lints the built `dist/` bundle
# wherever one exists on disk, throwing thousands of `no-undef`s, but a fresh
# checkout has no `dist/` yet, so a job that lints before it ever builds stays
# green regardless of whether that ignore is broken (see eslint.config.js's
# `ignores` comment, which is the actual record of this bug). Building the
# editor before lint (below) is what makes this job exercise the case that
# exposes the bug instead of the case that hides it.
on:
  pull_request:
  push:
    branches: [main]

# A rapid string of pushes to the same PR used to queue every run instead of
# superseding it: each earlier run kept burning a runner for a result nobody
# would read. Grouping by workflow+ref and cancelling the in-progress one
# means only the newest push's run finishes — a PR's own commits are
# disposable in a way `main`'s are not. That per-ref grouping is exactly what
# `main` must NOT get: GitHub cancels a `pending` run whenever a third run
# queues behind it (docs: "any existing pending job ... will be canceled"),
# so restricting `cancel-in-progress` to `pull_request` alone (#79) is not
# enough — with three quick merge-train pushes, SHA1 runs, SHA2 pends, SHA3
# still cancels SHA2's pending run, leaving that intermediate `main` SHA with
# no completed gate run. Keying the group by `github.sha` instead of
# `github.ref` for non-PR events gives every push to `main` its own group, so
# no `main` run ever shares a group with — and therefore never queues behind
# or supersedes — another; `cancel-in-progress` only ever fires within a PR's
# shared per-ref group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The org default is already read-only, but that default lives in repo
# settings, not in this file — a future org-wide change (or a fork whose
# default differs) would silently widen this workflow's token unless the
# ceiling is pinned here too.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    # Equal to turbo's own default — a fresh checkout with this unset still
    # resolves to `.turbo/cache` — so this exists only to say so once instead
    # of repeating it on every step below that happens to invoke turbo.
    env:
      TURBO_CACHE_DIR: .turbo/cache
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
          # This action auto-detects `packageManager` and tries to cache pnpm's store
          # by shelling out to `pnpm store path` — before corepack has ever
          # put a `pnpm` on PATH, which fails outright. We don't want that
          # cache anyway (see the "Do NOT cache pnpm's store" comment below),
          # so turn the feature off rather than reorder around it.
          package-manager-cache: false

      # Node has been dropping corepack from the default install (deprecated
      # since v22, no longer guaranteed bundled by the Node version pinned in
      # .nvmrc), so `corepack enable` alone is not reliable across runner
      # images. Installing it explicitly makes the step work the same whether
      # or not this Node build ships it, and corepack then reads
      # package.json's `packageManager` to fetch the exact pinned pnpm. Pinned
      # to an exact version rather than `@latest`: this runs on a cold runner
      # before anything has verified corepack itself, which is exactly the
      # kind of install `@latest` should never drive on a workflow whose whole
      # point is cold supply-chain verification (see the `minimumReleaseAge`
      # comment below) — 0.36.0 is current as of this writing.
      - name: Enable corepack
        run: |
          npm install -g corepack@0.36.0
          corepack enable

      # Cache only turbo's own local cache. Do NOT cache pnpm's store or its
      # `lockfile-verified.jsonl` (under the pnpm home/cache dir): that file
      # records lockfile entries pnpm has already re-verified against the
      # minimumReleaseAge supply-chain guard, and a warm copy lets
      # `--frozen-lockfile` skip that re-verification — passing on a runner
      # what a genuinely cold one would reject. Turbo's cache carries no such
      # trust decision, only task outputs keyed by content hash, so caching it
      # is free of that risk. The key mixes the lockfile (dependency graph)
      # and tracked sources (what turbo actually hashes tasks against), but
      # correctness does not come from the key: it comes from turbo re-hashing
      # and re-validating every task's own inputs regardless of which cache
      # entry got restored. `restore-keys` is allowed to fall back all the way
      # to any prior cache for this OS precisely because a wrong restore is
      # merely a wasted download, never a false cache hit.
      - name: Cache turbo
        uses: actions/cache@v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/**/src/**', 'apps/**/src/**') }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Requested as its own step rather than folded into `pnpm gate` (or
      # `gate:full`, which runs `turbo run build test typecheck lint
      # check-bundle-size` in one invocation): `test`/`typecheck`/`lint` only
      # depend on `^build` — a package's OWN dependencies — never on that
      # same package's own `build` task, so nothing in turbo's graph forces
      # apps/editor's `build` to finish before its `lint` when both are
      # requested in one `turbo run`.
      # Two separate CI steps make the runner's own shell sequencing do what
      # turbo's task graph does not: `dist/` is fully written before the next
      # step can start.
      # `check-bundle-size` rides in the same invocation as `build`, unlike
      # `test`/`typecheck`/`lint` above: it dependsOn apps/editor's own
      # `build` task (not `^build`), so turbo's graph — not runner-level
      # step ordering — is what makes it wait for `dist/` here. Vite/rolldown's
      # 500 kB chunk-size message is only ever a warning (see
      # apps/editor/vite.config.ts's manual-chunking comment); this re-reads
      # the built output and turns a regrown bundle into a real failure (#57).
      - name: Build
        run: pnpm turbo run build check-bundle-size

      # `pnpm gate` is the same script a local run uses (turbo.json calls
      # `gate`/`gate:full` the turbo-fronted entry points for exactly this
      # reason), so CI and local runs share one gate definition instead of two
      # command lists drifting apart.
      - name: Gate
        run: pnpm gate

  # A separate job, not a step folded into `gate` above: installing a browser
  # and driving a full editor session through it is minutes slower than the
  # rest of the gate, and nothing in `gate` depends on its result. Splitting
  # it out means a PR's required `gate` check turns green on its own fast
  # path while this one is still building and capturing screenshots (#56,
  # per #60's ruling).
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Enable corepack
        run: |
          npm install -g corepack@0.36.0
          corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `--with-deps` shells out to apt for Chromium's shared-library
      # dependencies. It rides in on the CI invocation rather than living in
      # package.json's `browsers` script itself, because that script also
      # runs on contributors' own machines (see README.md) — an unasked-for
      # apt-get would be a surprise there, and `--with-deps` is only ever
      # correct on the Linux runner this job actually runs on.
      - name: Install browsers
        run: pnpm browsers --with-deps

      # No separate "build workspace deps" step: every `packages/*` `exports`
      # its `./src/index.ts` directly (see e.g. `packages/viewport/package.json`)
      # rather than a built `dist/`, and none declares a `build` script — verified
      # by running `turbo run build --filter='@map-editor/editor^...'` here, which
      # reports 0 tasks. `apps/editor` is the only package with a real build, and
      # scripts/tour.mjs already runs it (`vite build`, from its own header
      # comment) against those sources directly before driving the result.
      # The smoke test #56/#60 asked for: `pnpm tour` already fails on a
      # console error or a scripted step whose own assertion did not hold
      # (see scripts/tour.mjs's `expect()`), and now also on a below-floor
      # luminance reading — the black-frame signature named in FINDINGS.md's
      # "Bloom renders black under software GL" — or too few triangles.
      # Thresholds and the reasoning behind each are recorded next to them in
      # scripts/tour.mjs. No pixel baselines (#60): SwiftShader-vs-Metal and
      # run-to-run GL noise would make a pixel diff a tolerance-tuning
      # treadmill without a stable GPU runner to diff against.
      - name: Tour
        run: pnpm tour

      # Uploaded on every run, pass or fail, so a human can look at what the
      # structural checks above cannot judge — composition, art, whether a
      # face actually reads correctly — the same way both of this project's
      # real rendering bugs were originally found (see FINDINGS.md). Per
      # #60's ruling, this is what "attach a screenshot to the PR" becomes:
      # link this run's artifact instead.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tour-screenshots
          path: shots/tour/
          if-no-files-found: ignore
