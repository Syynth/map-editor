# The globs are declared before any package exists so the pnpm switch and the
# first file move stay separately revertable — see docs/monorepo-migration.md.
packages:
  - 'packages/*'
  - 'apps/*'

# pnpm 12 checks lockfile entries against a minimum-release-age window (a
# supply-chain guard against a freshly compromised release), 1440 minutes
# (24h) built in. `minimumReleaseAgeStrict: true` (#39) turns that from an
# advisory into a gate for a *fresh resolve* — adding or upgrading a
# dependency that lands on a too-new version. Without this flag, that resolve
# does NOT fail: it silently appends an exemption to
# `minimumReleaseAgeExclude` below and proceeds ("Added N entries to
# minimumReleaseAgeExclude ..."), which is exactly the silent-drift failure
# mode #39 was opened to close. With it on, the same resolve hard-fails
# instead (`ERR_PNPM_NO_MATURE_MATCHING_VERSION`), so a too-new dependency has
# to be either waited out or added here on purpose by a human. Proved on a
# scratch package.json pinned to a too-new version: `minimumReleaseAgeStrict:
# false` silently wrote the exclude entry and succeeded; `true` failed instead
# and left the workspace file untouched.
#
# This flag makes no difference to *re-verifying an already-committed*
# lockfile against the window — that path (what `pnpm install
# --lockfile-only` or `--frozen-lockfile` does against the entry below, still
# inside the window as of this commit) hard-fails with
# `ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION` either way, strict or not, which is
# exactly why it is committed as an explicit exclude rather than left for
# pnpm to silently paper over.
#
# `@types/three@0.186.0` was pinned by the toolchain-baseline commit and was
# re-checked against the npm registry's publish timestamp when #39 landed —
# still falls inside the 24h window as of this commit, so it isn't dropped
# yet. Drop it once its version has aged past the window — the guard is only
# meaningful for the next package we add.
#
# `xstate@6.0.0-alpha.53`'s entry (#31) was dropped here: the registry's
# publish timestamp for that version is 2026-09-11T13:13:08Z, so its 24h
# window closed at 2026-09-12T13:13:08Z — confirmed by re-verifying the
# lockfile with the entry removed. `xstate` itself stays pinned exactly in
# `packages/document/package.json`; only the now-dead exclude line is gone.
#
# CI does not cache pnpm's `lockfile-verified.jsonl` (the file that records
# which lockfile entries have already cleared this check) for the same reason
# this flag exists: a warm copy would let a runner skip re-verification that a
# genuinely cold one would perform. See the "Do NOT cache pnpm's store" step
# comment in `.github/workflows/gate.yml`, which is this ruling's other home.
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - '@types/three@0.186.0'

# #55: `engineStrict` gates a DEPENDENCY's declared `engines` reached through
# the dependency graph (pnpm CHANGELOG, 12.0.0) — it does not check this
# workspace's own root `engines.node` (verified: an unsatisfiable root range
# installed clean either way). Kept on for that narrower, real protection.
# The actual "wrong-Node-version install hard-fails" guard is root
# `package.json`'s `devEngines.runtime`, which pnpm 12.3.4 does enforce
# against the workspace's own manifest.
engineStrict: true
# #46: `tsup` brings `esbuild`, whose `postinstall` is a downloader that
# fetches the platform binary when the matching optional dependency is
# missing. pnpm installs `@esbuild/darwin-arm64` (and its siblings on other
# platforms) as a real optional dependency, so the binary is already on disk
# and the script has nothing to do — verified by running the emitter with the
# script declined: `node -e "require('esbuild')"` loads and every package
# builds. Declining it is therefore free, and an install script that reaches
# the network is exactly the kind of thing this workspace's other
# supply-chain settings exist to keep out. pnpm 12 hard-fails an install
# (`ERR_PNPM_IGNORED_BUILDS`) on an UNDECLARED ignored build, so this entry is
# what keeps `pnpm install` green on a fresh clone rather than a silent skip.
allowBuilds:
  esbuild: false
