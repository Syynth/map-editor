name: Visual

# The tour used to ride in gate.yml as a second job on every PR. It was never
# a required check, but it took ~4 minutes against the gate's ~1, and anything
# that waited for "the run" — a merge loop, a person watching the checks —
# waited for it. Ruled 2026-09-12: not worth that time on every PR. It is
# still the only thing that looks at the rendered editor (#56, #60), so it
# stays runnable by hand — `gh workflow run visual.yml --ref <branch>` — for a
# rendering change, and its screenshots are still uploaded as an artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Enable corepack
        run: |
          npm install -g corepack@0.36.0
          corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `--with-deps` shells out to apt for Chromium's shared-library
      # dependencies. It rides in on the CI invocation rather than living in
      # package.json's `browsers` script itself, because that script also
      # runs on contributors' own machines (see README.md) — an unasked-for
      # apt-get would be a surprise there, and `--with-deps` is only ever
      # correct on the Linux runner this job actually runs on.
      - name: Install browsers
        run: pnpm browsers --with-deps

      # No separate "build workspace deps" step, but no longer because there is
      # nothing to build: before #46 every `packages/*` `exports`ed its
      # `./src/index.ts` directly and none declared a `build`, so
      # `turbo run build --filter='@papercut/editor^...'` reported 0 tasks;
      # it now reports 10, and `apps/editor`'s production bundle is assembled
      # from those packages' `dist/*.js` (the `default` condition), so this job
      # on a fresh checkout would fail at `vite build` with an unresolved
      # `@papercut/geometry`. scripts/tour.mjs runs that same filtered
      # `turbo run build` itself, immediately before its `vite build`, so
      # `pnpm tour` stays self-contained here and on a contributor's machine
      # alike rather than depending on a build step this job would have to
      # remember to keep.
      # The smoke test #56/#60 asked for: `pnpm tour` already fails on a
      # console error or a scripted step whose own assertion did not hold
      # (see scripts/tour.mjs's `expect()`), and now also on a below-floor
      # luminance reading — the black-frame signature named in FINDINGS.md's
      # "Bloom renders black under software GL" — or too few triangles.
      # Thresholds and the reasoning behind each are recorded next to them in
      # scripts/tour.mjs. No pixel baselines (#60): SwiftShader-vs-Metal and
      # run-to-run GL noise would make a pixel diff a tolerance-tuning
      # treadmill without a stable GPU runner to diff against.
      - name: Tour
        run: pnpm tour

      # Uploaded on every run, pass or fail, so a human can look at what the
      # structural checks above cannot judge — composition, art, whether a
      # face actually reads correctly — the same way both of this project's
      # real rendering bugs were originally found (see FINDINGS.md). Per
      # #60's ruling, this is what "attach a screenshot to the PR" becomes:
      # link this run's artifact instead.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tour-screenshots
          path: shots/tour/
          if-no-files-found: ignore
